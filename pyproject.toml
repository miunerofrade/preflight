[project]
name = "preflight"
version = "0.1.0"
description = "Security preflight for anything you feed your AI agent - Clocked Build Challenge entry"
requires-python = ">=3.10"
dependencies = [
    "clocked-sdk>=0.7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.28.2,<2",
    "mcp>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
