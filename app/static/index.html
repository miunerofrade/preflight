<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preflight — AI Agent Input Security</title>
  <meta name="description" content="Paste untrusted content, get an allow / review / block verdict before it reaches your AI agent.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3.5' fill='%234f46e5'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
<main class="shell">
  <header class="masthead">
    <button class="btn btn-quiet lang-toggle" id="lang-toggle" type="button" data-i18n-aria="lang.aria" data-i18n-title="lang.aria"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></button>
    <h1>Preflight</h1>
    <p class="tagline" data-i18n="head.tagline"></p>
    <p class="lede" data-i18n="head.lede"></p>
  </header>

  <section class="panel" aria-labelledby="input-label">
    <div class="panel-head">
      <label class="field-label" id="input-label" for="input" data-i18n="input.label"></label>
      <span class="hint" id="charcount" aria-live="polite"></span>
    </div>
    <textarea id="input" rows="9" spellcheck="false"></textarea>
    <div class="toolbar">
      <div class="mode-switch" role="group" data-i18n-aria="mode.aria">
        <button id="mode-single" class="mode-btn active" type="button" data-i18n="mode.single"></button>
        <button id="mode-batch" class="mode-btn" type="button" data-i18n="mode.batch"></button>
        <button id="mode-url" class="mode-btn" type="button" data-i18n="mode.url"></button>
      </div>
      <div class="toolbar-actions">
        <button id="file-btn" class="btn btn-quiet" type="button" data-i18n="btn.file"></button>
        <button id="run" class="btn btn-primary" type="button" data-i18n="btn.run"></button>
      </div>
    </div>
    <div class="progress" id="progress" hidden>
      <div class="progress-head">
        <span id="progress-label"></span>
        <span id="progress-count"></span>
      </div>
      <div class="bar progress-bar" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="progress.aria"><i id="progress-fill"></i></div>
    </div>
    <input type="file" id="file" accept=".pdf,application/pdf,image/*" hidden>
    <div class="examples">
      <p class="examples-label" data-i18n="examples.label"></p>
      <div class="example-grid" id="example-grid"></div>
      <button type="button" class="examples-toggle" id="examples-toggle" aria-expanded="false" aria-controls="example-grid"></button>
    </div>
  </section>

  <p id="error" class="error" role="alert" hidden></p>

  <section id="results" class="results" aria-live="polite" hidden>
    <section class="panel" id="batch" hidden></section>

    <section class="verdict panel" aria-labelledby="verdict-word">
      <div class="verdict-summary">
      <div class="gauge" role="img" id="gauge" data-i18n-aria="gauge.ariaIdle">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="gauge-track" cx="60" cy="60" r="52"></circle>
          <circle class="gauge-fill" id="gauge-fill" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div class="gauge-center">
          <span id="gauge-num">—</span>
          <span class="gauge-cap" data-i18n="gauge.cap"></span>
        </div>
      </div>
      <div class="verdict-main">
        <p class="verdict-word" id="verdict-word">—</p>
        <p class="verdict-conf" id="verdict-conf"></p>
        <ul class="policy-reasons" id="policy-reasons" hidden></ul>
      </div>
      </div>
      <div class="verdict-probs" id="verdict-probs"></div>
    </section>

    <div class="cards" id="cards">
      <article class="card panel" id="card-injection">
        <h2 data-i18n="card.inj.h"></h2>
        <div class="card-body" id="body-injection"></div>
      </article>

      <article class="card panel" id="card-script">
        <h2 data-i18n="card.script.h"></h2>
        <div class="card-body" id="body-script"></div>
      </article>

      <article class="card panel" id="card-pii">
        <h2 data-i18n="card.pii.h"></h2>
        <div class="card-body" id="body-pii"></div>
      </article>
    </div>

    <section class="panel" id="pdf-inspection" hidden></section>
    <div class="cards" id="url-cards" hidden></div>

    <section class="panel" aria-labelledby="source-label">
      <div class="panel-head">
        <h2 id="source-label" data-i18n="source.h"></h2>
        <div class="legend" aria-hidden="true">
          <span class="key" data-layer="inj" hidden><i class="dot dot-inj"></i><span data-i18n="legend.inj"></span></span>
          <span class="key" data-layer="script" hidden><i class="dot dot-script"></i><span data-i18n="legend.script"></span></span>
          <span class="key" data-layer="pii" hidden><i class="dot dot-pii"></i><span data-i18n="legend.pii"></span></span>
        </div>
      </div>
      <p class="routing" id="routing"></p>
      <pre class="source" id="source"></pre>
    </section>

    <section class="panel" id="sanitized-panel" aria-labelledby="sanitized-label" hidden>
      <div class="panel-head">
        <h2 id="sanitized-label" data-i18n="handoff.h"></h2>
        <div class="handoff-actions">
          <span class="chip" id="handoff-status"></span>
          <button id="copy" class="btn btn-quiet" type="button" data-i18n="btn.copy" disabled></button>
        </div>
      </div>
      <p class="note" id="handoff-note"></p>
      <div class="handoff-checks" id="handoff-checks" hidden></div>
      <div class="handoff-review" id="handoff-diff" hidden>
        <button class="text-action" id="handoff-diff-label" type="button" data-detail="edits"></button>
        <p class="note" id="handoff-diff-note" hidden></p>
        <div id="handoff-edits" hidden></div>
      </div>
      <pre class="source" id="sanitized"></pre>
      <label class="handoff-confirm" id="handoff-confirm" hidden>
        <input type="checkbox" id="confirm-copy">
        <span data-i18n="handoff.confirm"></span>
      </label>
    </section>

    <p class="stats" id="stats"></p>

    <div class="export-row" id="export-row" hidden>
      <button id="export-json" class="btn btn-quiet" type="button" data-i18n="btn.exportJson"></button>
      <button id="export-md" class="btn btn-quiet" type="button" data-i18n="btn.exportMd"></button>
      <button id="generate-report" class="btn btn-quiet" type="button" data-i18n="btn.generateReport"></button>
    </div>
    <p class="note report-error" id="report-error" role="status" hidden></p>
  </section>

  <footer class="foot">
    <p data-i18n="foot.text"></p>
  </footer>
</main>
<dialog class="detail-dialog" id="detail-dialog" aria-labelledby="detail-title">
  <header class="detail-header">
    <h2 id="detail-title"></h2>
    <button class="dialog-close" id="detail-close" type="button" data-i18n-aria="dialog.close" autofocus>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="detail-body" id="detail-body"></div>
</dialog>
<script src="/static/i18n.js?v=15"></script>
<script src="/static/reports.js?v=15"></script>
<script src="/static/app.js?v=15"></script>
</body>
</html>
